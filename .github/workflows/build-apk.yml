name: Build Math Adventure APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip MathAdventureAndroid-GitHub-build.zip

      - name: Build APK
        working-directory: MathAdventureAndroid
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MathAdventure-APK
          path: MathAdventureAndroid/app/build/outputs/apk/debug/app-debug.apk
